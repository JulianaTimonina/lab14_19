# k8s/hpa.yaml
# Horizontal Pod Autoscaler для Go-сборщика
# Автоскалирование на основе загрузки CPU и длины очереди (через custom metrics)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: energy-collector-hpa
  namespace: energy-system
  labels:
    app: energy-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: energy-collector
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Автоскалирование по CPU (утилизация > 50%)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    # Автоскалирование по памяти (утилизация > 70%)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30