# k8s/collector-deployment.yaml
# Развёртывание Go-сборщика данных с HPA (Horizontal Pod Autoscaler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-collector
  namespace: energy-system
  labels:
    app: energy-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: energy-collector
  template:
    metadata:
      labels:
        app: energy-collector
    spec:
      containers:
        - name: collector
          image: energy-collector:latest
          imagePullPolicy: IfNotPresent
          args:
            - -id=$(POD_NAME)
            - -endpoints=etcd:2379
            - -meters=50
            - -shards=5
            - -interval=10s
            - -kafka
            - -kafka-brokers=kafka:9092
            - -kafka-topic=energy-readings
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 50051
              name: arrow
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "ps aux | grep collector | grep -v grep"
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "ps aux | grep collector | grep -v grep"
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: energy-collector
  namespace: energy-system
  labels:
    app: energy-collector
spec:
  ports:
    - port: 50051
      name: arrow
      targetPort: 50051
  selector:
    app: energy-collector
  clusterIP: None  # Headless service for direct pod access